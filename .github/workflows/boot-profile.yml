name: boot-profile

# Boots the guest once on KVM with initcall_debug and prints where the
# kernel spends its boot time (slowest initcalls, timeline milestones).
#
# PERF: the kernel does not print the initcalls to the console. Printing them
# (loglevel=8) costs a VM exit per character on the emulated serial port and
# stretches a 0.4 s boot to 2-4 s, so it would be profiling another boot. They
# stay in the kernel's ring buffer (log_buf_len=4M holds all of them) and the
# agent dumps the buffer to the console once the host has connected
# (oar.dumpkmsg=1), when the boot that is measured is over.
on:
  workflow_dispatch:
    inputs:
      cmdline:
        description: extra kernel command line
        default: ""

env:
  GO_VERSION: "1.26"

jobs:
  profile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: kernel cache
        id: kcache
        uses: actions/cache@v6
        with:
          path: |
            guest/out/amd64/kernel*
            guest/out/amd64/vmlinux
          key: kernel-amd64-${{ hashFiles('guest/kernel*.config', 'guest/build-kernel.sh', 'guest/Dockerfile', 'guest/build.sh') }}
      - if: steps.kcache.outputs.cache-hit != 'true'
        run: guest/build.sh amd64 kernel
      - run: guest/build.sh amd64 initramfs
      - name: enable kvm and vhost-vsock
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo modprobe vhost_vsock && sudo chmod 666 /dev/vhost-vsock
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86
      - run: CGO_ENABLED=0 go build -o bin/oar ./cmd/oar
      - name: boot with initcall_debug
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
        run: |
          OAR_STATE=$XDG_DATA_HOME/oar
          for run in plain debug; do
            extra="${{ github.event.inputs.cmdline }}"
            [ $run = debug ] && extra="$extra initcall_debug log_buf_len=4M oar.dumpkmsg=1"
            bin/oar vm start --backend kvm --cpus 2 --memory 4096 --guest-cmdline "$extra"
            if [ $run = debug ]; then
              # the dump starts after the host's first request and takes a
              # while on the serial console: wait for the line that ends it
              for _ in $(seq 150); do
                grep -q "kernel log dump " "$OAR_STATE/vms/default/console.log" && break
                sleep 0.2
              done
              grep -q "kernel log dump done" "$OAR_STATE/vms/default/console.log" ||
                echo "::warning::the kernel log dump did not finish"
            fi
            cp "$OAR_STATE/vms/default/console.log" "console-$run.log"
            echo "== $run: phases (ms since start)"
            jq -c '.phases | map_values(. / 1000000 | floor)' "$OAR_STATE/vms/default/state.json"
            bin/oar vm stats | sed -n '1,12p'
            bin/oar vm stop
            rm -f "$OAR_STATE/vms/default/data.img"
          done
          echo "== slowest initcalls (usecs)"
          grep -oE "initcall [^ ]+ returned [-0-9]+ after [0-9]+ usecs" console-debug.log |
            awk '{print $6, $2}' | sort -rn | head -40
          grep -oE "initcall [^ ]+ returned [-0-9]+ after [0-9]+ usecs" console-debug.log |
            awk '{s+=$6} END {print "total:", s, "usecs"}'
          echo "== milestones (kernel records are level,sequence,usecs since boot,flags;message)"
          grep -E "Linux version|Unpacking initramfs|Freeing initrd|Freeing unused kernel|Run /init|oar-init" console-debug.log | head -20
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-profile
          path: console-*.log

  cloud-hypervisor:
    # roadmap P1-2: Cloud Hypervisor vs QEMU microvm on the same runner
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: kernel cache
        id: kcache
        uses: actions/cache@v6
        with:
          path: |
            guest/out/amd64/kernel*
            guest/out/amd64/vmlinux
          key: kernel-amd64-${{ hashFiles('guest/kernel*.config', 'guest/build-kernel.sh', 'guest/Dockerfile', 'guest/build.sh') }}
      - if: steps.kcache.outputs.cache-hit != 'true'
        run: guest/build.sh amd64 kernel
      - run: guest/build.sh amd64 initramfs
      - name: enable kvm and vhost-vsock
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo modprobe vhost_vsock && sudo chmod 666 /dev/vhost-vsock
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86
      - name: install cloud-hypervisor
        run: |
          curl -fsSL -o ch https://github.com/cloud-hypervisor/cloud-hypervisor/releases/latest/download/cloud-hypervisor-static
          chmod +x ch && ./ch --version
      - run: CGO_ENABLED=0 go build -o bin/oar ./cmd/oar
      - name: qemu microvm (oar kvm backend)
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
        run: |
          OAR_STATE=$XDG_DATA_HOME/oar
          for i in 1 2 3; do
            for state in cold warm; do
              [ $state = cold ] && rm -f "$OAR_STATE/vms/default/data.img"
              bin/oar vm start --backend kvm --cpus 2 --memory 4096 >/dev/null
              p=$(jq -c '.phases | map_values(. / 1000000 | floor)' "$OAR_STATE/vms/default/state.json")
              rss=$(ps -o rss= -C qemu-system-x86_64 | head -1)
              echo "qemu microvm $state: $p RSS $((rss/1024)) MiB"
              bin/oar vm stop >/dev/null
            done
          done
      - name: cloud-hypervisor
        run: go run ./hack/chboot -ch ./ch -kernel guest/out/amd64/vmlinux -initrd guest/out/amd64/initramfs.cpio.lz4
