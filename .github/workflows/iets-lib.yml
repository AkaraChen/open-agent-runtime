# Builds the iets static library (rust/iets-ffi) for every supported host
# platform and, on an `iets-lib-<rev>` tag, attaches the libraries to a
# release so hack/fetch-iets.sh can install them without a Rust toolchain.
name: iets-lib

on:
  workflow_dispatch:
  push:
    tags: ["iets-lib-*"]

jobs:
  build:
    name: libiets_ffi (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, platform: linux/amd64 }
          - { os: ubuntu-26.04-arm, platform: linux/arm64 }
          - { os: macos-26, platform: darwin/arm64 }
          - { os: macos-26-intel, platform: darwin/amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/iets-ffi
      - run: hack/build-iets.sh ${{ matrix.platform }}
      - name: name the artifact
        shell: bash
        run: |
          p=${{ matrix.platform }}
          dir=internal/nixeval/iets/lib/${p%/*}_${p#*/}
          mkdir -p out
          cp "$dir/libiets_ffi.a" "out/libiets_ffi-${p%/*}_${p#*/}.a"
          echo "$(cat "$dir/SHA256")  libiets_ffi-${p%/*}_${p#*/}.a" > "out/libiets_ffi-${p%/*}_${p#*/}.a.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: libiets_ffi-${{ matrix.platform }}
          path: out/
          retention-days: 30

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/iets-lib-')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
