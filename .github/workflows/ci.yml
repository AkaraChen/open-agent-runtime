name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./...
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Windows'
        with:
          workspaces: rust/iets-ffi
      - name: embedded nix evaluator
        if: runner.os != 'Windows'
        run: |
          hack/build-iets.sh
          go vet -tags iets ./...
          go test -tags iets ./...
      - name: cross-compile
        shell: bash
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/oar
          done
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/oar-agent
      - name: build with Virtualization.framework
        if: runner.os == 'macOS'
        run: hack/build.sh

  guest:
    name: guest image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: kernel cache
        id: kcache
        uses: actions/cache@v4
        with:
          path: guest/out/${{ matrix.arch }}/kernel*
          key: kernel-${{ matrix.arch }}-${{ hashFiles('guest/kernel*.config', 'guest/build-kernel.sh', 'guest/Dockerfile', 'guest/build.sh') }}
      - name: build kernel
        if: steps.kcache.outputs.cache-hit != 'true'
        run: guest/build.sh ${{ matrix.arch }} kernel
      - name: build initramfs
        run: guest/build.sh ${{ matrix.arch }} initramfs
      - uses: actions/upload-artifact@v4
        with:
          name: guest-${{ matrix.arch }}
          path: guest/out/${{ matrix.arch }}/
          retention-days: 7

  e2e-linux-native:
    name: e2e linux native (runc on host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/iets-ffi
      - run: hack/build.sh
      - run: which runc && runc --version
      - run: BACKEND=native hack/e2e.sh
      - name: config switch benchmark
        run: BACKEND=native hack/switch-bench.sh 6

  e2e-linux-kvm:
    name: e2e linux kvm (resident QEMU/KVM guest)
    needs: guest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: guest-amd64
          path: guest/out/amd64
      - name: enable kvm and vhost-vsock
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo modprobe vhost_vsock
          sudo chmod 666 /dev/vhost-vsock
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86
          ls -l /dev/kvm /dev/vhost-vsock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/iets-ffi
      - run: hack/build.sh
      - run: BACKEND=kvm hack/e2e.sh --cpus 2 --memory 3072
      - name: config switch benchmark
        run: BACKEND=kvm hack/switch-bench.sh 6 --cpus 2 --memory 3072

  e2e-macos:
    name: e2e macos ${{ matrix.backend }} (${{ matrix.os }})
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel runners expose the hypervisor: full VZ run
          - { os: macos-15-intel, arch: amd64, backend: vz }
          # Apple Silicon runners are M1 VMs without nested virtualization:
          # VZ must be reported unavailable, the resident guest runs on QEMU
          - { os: macos-15, arch: arm64, backend: vz, expect: unavailable }
          - { os: macos-15, arch: arm64, backend: qemu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
        with:
          name: guest-${{ matrix.arch }}
          path: guest/out/${{ matrix.arch }}
      - name: host info
        run: |
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string || true
          sysctl kern.hv_support || true
      - if: matrix.backend == 'qemu' || matrix.expect == 'unavailable'
        run: brew install qemu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/iets-ffi
      - run: hack/build.sh
      - run: bin/oar vm backends
      - name: embedded evaluator agrees with nix-instantiate
        run: |
          for b in embedded local; do
            bin/oar nix-eval --backend $b --json hello nodejs_22 python313 git \
              | python3 -m json.tool --sort-keys > /tmp/parity-$b.json
          done
          diff /tmp/parity-embedded.json /tmp/parity-local.json
      - name: VZ is reported unavailable and QEMU is the default
        if: matrix.expect == 'unavailable'
        run: |
          if bin/oar vm start --backend vz 2>err.txt; then echo "vz unexpectedly started"; exit 1; fi
          cat err.txt
          grep -q "not available" err.txt
          bin/oar vm backends | grep -E '^qemu +\(default\)'
      - if: matrix.expect != 'unavailable'
        run: BACKEND=${{ matrix.backend }} hack/e2e.sh --cpus 3 --memory 4096
